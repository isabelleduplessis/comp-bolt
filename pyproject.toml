[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comp-bolt"
version = "0.1.0"
description = "Comp-BOLT: Computational Biology project Organization, Logging, and Tracking"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
bolt = "bolt.cli:main"

[tool.setuptools.packages.find]
include = ["bolt*"]
